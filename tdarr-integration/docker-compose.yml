services:
  tdarr:
    container_name: tdarr
    image: haveagitgat/tdarr:latest
    restart: unless-stopped
    environment:
      - TZ=UTC
      - PUID=1001
      - PGID=1001
      - serverIP=tdarr
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
    volumes:
      - ../../stash/media/tdarr-config/server:/app/server
      - ../../stash/media/tdarr-config/configs:/app/configs
      - ../../stash/media/tdarr-config/logs:/app/logs
      - ../../stash/media/movies:/media/movies
      - ../../stash/media/tv:/media/tv
      - ../../stash/media/tdarr-cache:/temp
      - ../../stash/I_Music:/media/music
      - ../../stash/I_Video:/media/video
      - ../../stash/I_Ingest:/media/ingest
    ports:
      - "8265:8265"
      - "8266:8266"
networks:
  default:
    name: proxion-network
    external: true
