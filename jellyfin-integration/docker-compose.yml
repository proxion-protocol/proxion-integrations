version: '3.5'
services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # network_mode: 'host'
    ports:
      - "8096:8096"
    networks:
      - proxion-sso
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ../../stash/I_Video:/media:ro
    restart: 'unless-stopped'

networks:
  proxion-sso:
    external: true
    # Optional: for hardware acceleration
    # devices:
    #  - /dev/dri/renderD128:/dev/dri/renderD128
    #  - /dev/dri/card0:/dev/dri/card0
