version: '3'
services:
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    build:
      context: .
      dockerfile: Dockerfile.hardened
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      - TZ=UTC
    volumes:
      - ${STASH_ROOT}/media/jellyseerr-config:/app/config
    ports:
      - "5056:5055"
networks:
  default:
    name: proxion-network
    external: true
