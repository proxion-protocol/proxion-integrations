version: "3"
services:
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # DNS infrastructure - never auto-update
    networks:
      proxion-network:
        ipv4_address: 172.20.0.53

networks:
  proxion-network:
    external: true
