services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=UTC
    volumes:
      - ../../stash/media/lidarr-config:/config
      - ../../stash/I_Music:/music
      - ../../stash/downloads/data:/downloads
    ports:
      - "8686:8686"
networks:
  default:
    name: proxion-network
    external: true
