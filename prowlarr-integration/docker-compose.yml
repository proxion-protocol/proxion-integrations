version: '3'
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - HTTP_PROXY=socks5h://${BRIDGE_IP}:1080
      - HTTPS_PROXY=socks5h://${BRIDGE_IP}:1080
      - ALL_PROXY=socks5h://${BRIDGE_IP}:1080
      - NO_PROXY=localhost,127.0.0.1,::1,${BRIDGE_IP},prowlarr,radarr,sonarr,lidarr,transmission
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${STASH_ROOT}/media/indexers/config:/config
    ports:
      - "9696:9696"
networks:
  default:
    name: proxion-network
    external: true
