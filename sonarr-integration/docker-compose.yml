version: '3'
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - TZ=UTC
    volumes:
      - ${STASH_ROOT}/media/sonarr-config:/config
      - ${MEDIA_SHOWS}:/tv
      - ${LOCAL_DOWNLOADS}:/downloads
      - ${SONARR_STAGING}:/downloads/sonarr
    ports:
      - "8989:8989"
networks:
  default:
    name: proxion-network
    external: true
