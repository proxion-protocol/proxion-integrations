services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "4533:4533"
    environment:
      # Optional: put your config options here, e.g.:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info  
      ND_BASEURL: ""
      PUID: 1001
      PGID: 1001
    restart: unless-stopped
    volumes:
      - "./data:/data"
      - "${MEDIA_MUSIC}:/music:ro"
    networks:
      - default

networks:
  default:
    name: proxion-network
    external: true
