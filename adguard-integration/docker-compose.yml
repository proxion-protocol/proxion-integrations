version: "3"
services:
  adguardhome:
    build:
      context: .
      dockerfile: Dockerfile.hardened
    container_name: adguardhome
    restart: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"
      - "68:68/udp"
      - "853:853/tcp"
      - "784:784/udp"
      - "8853:8853/udp"
      - "5443:5443/tcp"
      - "5443:5443/udp"
      - "127.0.0.1:3055:3000/tcp" # Setup/UI
    healthcheck:
      # Test DNS resolution through AdGuardHome from inside the container.
      # Docker will auto-restart the container if this fails 3 times in a row.
      test: ["CMD", "nslookup", "google.com", "127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # DNS server - never auto-update
    volumes:
      - ${CORE_STORAGE}/network/adguard/work:/opt/adguardhome/work
      - ${CORE_STORAGE}/network/adguard/conf:/opt/adguardhome/conf
    networks:
      - default
      - proxion-network

networks:
  proxion-network:
    external: true
