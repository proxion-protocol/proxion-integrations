version: '3'
services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    build:
      context: .
      dockerfile: Dockerfile.hardened
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - ALL_PROXY=socks5h://${BRIDGE_IP}:1080
    volumes:
      - ${STASH_ROOT}/media/subtitles/config:/config
      - ${MEDIA_MOVIES}:/movies
      - ${MEDIA_SHOWS}:/tv
    ports:
      - "6767:6767"
networks:
  default:
    name: proxion-network
    external: true
